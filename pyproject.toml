[project]
name = "tinysocial"
version = "0.0.1"
description = "A local, CPU-first social conversation model experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.1",
  "transformers==4.57.3",
  "peft==0.18.0",
  "accelerate==1.11.0",
  "psutil==7.1.3",
  "sentencepiece==0.2.1",
  "protobuf==6.33.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
