name: test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the wheel to PyPI after the tests pass"
        type: boolean
        default: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # The guard, facts and style tests need only the standard library; the training tests need the train group.
      - run: python -m unittest tests.test_facts tests.test_health tests.test_style
      - run: python -m pip install build && python -m build --wheel
        shell: bash
      - run: bash scripts/test_wheel.sh python

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing, no stored token
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
